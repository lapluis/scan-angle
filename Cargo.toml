[package]
name = "scan-angle"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Local batch skew-angle detection for scanned images"
default-run = "scan-angle"

[features]
default = ["cli", "gui"]
# 仅命令行（不链接窗口组件）：
#   cargo build --locked --release --no-default-features --features cli
cli = ["dep:clap"]
# 仅窗口（仍解析命令行参数以初始化控件）：
#   cargo build --locked --release --no-default-features --features gui
#   只启用 gui 时 cargo run 需显式指定 bin：
#   cargo run --locked --release --no-default-features --features gui --bin scan-angle-gui
gui = [
    "dep:clap",
    "dep:eframe",
    "dep:rfd",
    "dep:open",
    "windows/Win32_System_Console",
]

[[bin]]
name = "scan-angle"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "scan-angle-gui"
path = "src/bin/scan-angle-gui.rs"
required-features = ["gui"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
tiff = "0.11"
lsdetect = "0.4.0"
clap = { version = "4", features = ["derive", "string"], optional = true }
csv = "1"
walkdir = "2"
dunce = "1"
unicode-width = "0.2"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation", "Win32_Storage_FileSystem"] }
