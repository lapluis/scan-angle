name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r scripts/fixture-requirements.txt
      - run: python scripts/generate-fixtures.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: ./target/release/scan-angle.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: ScanAngle-Rust-windows-x64
          path: target/release/scan-angle.exe
